name:                dear-imgui-raw-imnodes
version:             0.0.0
synopsis:            Raw FFI bindings to imnodes (Nelarius/imnodes) for dear-imgui-raw-{vanilla,docking}.
license:             BSD-3-Clause

# imnodes is a node-editor extension for Dear ImGui. It links against
# the C++ ImGui core, so the package depends on whichever flavor the
# consumer has wired up via cabal flag — the binding itself does not
# differ between flavors (unlike the imgui_impl_*.cpp backends, where
# the docking branch diverges).

language: GHC2021

default-extensions:
- BlockArguments
- DuplicateRecordFields
- LambdaCase
- NoFieldSelectors
- OverloadedRecordDot
- OverloadedStrings

dependencies:
- base >= 4.7 && < 5

flags:
  vanilla:
    description: Build against dear-imgui-raw-vanilla.
    manual: true
    default: false
  docking:
    description: Build against dear-imgui-raw-docking.
    manual: true
    default: false

library:
  source-dirs: src
  ghc-options:
  - -Wall
  - -optc-Wno-discarded-qualifiers
  - -optc-Wno-incompatible-pointer-types
  cxx-sources:
  - cbits/dcimnodes.cpp
  - cbits/imnodes/imnodes.cpp
  - cbits/DearImGuiWrappers.cpp
  include-dirs:
  - cbits
  - cbits/imnodes
  install-includes:
  - dcimnodes.h
  - imnodes/imnodes.h
  - imnodes/imnodes_internal.h
  - DearImGuiWrappers.h
  extra-libraries:
  - stdc++
  cxx-options:
  - -std=c++11
  - -fpermissive
  build-tools:
  - hsc2hs
  when:
  - condition: flag(vanilla) && flag(docking)
    buildable: false
  - condition: "!flag(vanilla) && !flag(docking)"
    buildable: false
  - condition: flag(vanilla)
    dependencies:
    - dear-imgui-raw-vanilla
  - condition: flag(docking)
    dependencies:
    - dear-imgui-raw-docking
