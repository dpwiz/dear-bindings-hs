name:                dear-bindings-aeson
version:             0.1.0.0
github:              "dpwiz/dear-bindings-aeson"
license:             BSD-3-Clause
author:              "IC Rainbow"
maintainer:          "aenor.realm@gmail.com"
copyright:           "2026 IC Rainbow"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/dpwiz/dear-bindings-aeson#readme>

language: GHC2021

default-extensions:
- BlockArguments
- DuplicateRecordFields
- LambdaCase
- NoFieldSelectors
- OverloadedRecordDot
- OverloadedStrings

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.2
- bytestring
- containers
- text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

flags:
  executables:
    description: Build the CLI executables (pulls in pandoc; off by default).
    manual: true
    default: false

library:
  source-dirs: src

executables:
  dear-bindings-doc:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    when:
    - condition: "!flag(executables)"
      buildable: false
    dependencies:
    - dear-bindings-aeson
    - bytestring
    - containers
    - directory
    - filepath
    - optparse-applicative
    - pandoc
    - pandoc-types
    - text

  dear-bindings-ffi:
    main:                Main.hs
    source-dirs:         app-ffi
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    when:
    - condition: "!flag(executables)"
      buildable: false
    dependencies:
    - dear-bindings-aeson
    - bytestring
    - containers
    - directory
    - filepath
    - optparse-applicative
    - text

tests:
  dear-bindings-aeson-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - dear-bindings-aeson
    - aeson
    - bytestring
    - directory
    - filepath
    - tasty
    - tasty-hunit
